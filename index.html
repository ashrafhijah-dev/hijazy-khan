<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hijazy-Khan | Personal Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f19;
      color: white;
      line-height: 1.6;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #1b3155, #0b0f19 60%);
    }

    .hero {
      max-width: 700px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
      color: #00d4ff;
    }

    .hero h2 {
      font-size: 25px;
      margin-bottom: 20px;
    }

    .hero p {
      color: #b8c0cc;
      margin-bottom: 30px;
      font-size: 17px;
    }

    .btn {
      display: inline-block;
      padding: 13px 25px;
      background: #00d4ff;
      color: #061018;
      text-decoration: none;
      border-radius: 30px;
      font-weight: bold;
      margin: 5px;
      transition: 0.3s;
    }

    .btn:hover {
      transform: translateY(-3px);
      background: white;
    }

    section {
      padding: 80px 20px;
      max-width: 1000px;
      margin: auto;
    }

    section h2 {
      text-align: center;
      color: #00d4ff;
      font-size: 32px;
      margin-bottom: 35px;
    }

    .about {
      text-align: center;
      color: #c5cbd4;
      max-width: 750px;
      margin: auto;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: #121927;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      border: 1px solid #202b3e;
      transition: 0.3s;
    }

    .card:hover {
      transform: translateY(-7px);
      border-color: #00d4ff;
    }

    .card h3 {
      margin-bottom: 10px;
      color: white;
    }

    .card p {
      color: #aeb7c5;
    }

    .contact {
      text-align: center;
    }

    .socials {
      margin-top: 25px;
    }

    .socials a {
      display: inline-block;
      margin: 8px;
      color: #00d4ff;
      text-decoration: none;
      border: 1px solid #00d4ff;
      padding: 10px 18px;
      border-radius: 25px;
    }

    footer {
      text-align: center;
      padding: 25px;
      background: #070a
